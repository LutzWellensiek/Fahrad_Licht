<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#ff0000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Signal Light">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <title>Signal Light</title>
<style>
:root{
  color-scheme:dark;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
}
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  touch-action:none;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#ff0000;
  color:white;
}
body{
  min-height:100dvh;
  position:relative;
  user-select:none;
  -webkit-user-select:none;
}
#redLayer{
  position:fixed;
  inset:0;
  background:#ff0000;
  z-index:0;
}
#gestureSurface{
  position:fixed;
  inset:0;
  z-index:1;
}
#lockBtn{
  position:fixed;
  top:max(14px, env(safe-area-inset-top));
  right:max(14px, env(safe-area-inset-right));
  z-index:10;
  width:52px;
  height:52px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.35);
  background:rgba(0,0,0,.34);
  color:white;
  font-size:24px;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}
#lockBtn:active{transform:scale(.96)}
#info{
  position:fixed;
  left:50%;
  bottom:max(14px, env(safe-area-inset-bottom));
  transform:translateX(-50%);
  z-index:10;
  width:min(92vw,520px);
  border:1px solid rgba(255,255,255,.28);
  background:rgba(0,0,0,.38);
  border-radius:16px;
  padding:11px 13px;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  font-size:12px;
  line-height:1.35;
  text-align:center;
}
#status{
  margin-top:4px;
  opacity:.72;
  font-size:11px;
}
#hud{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  z-index:8;
  padding:10px 14px;
  border-radius:14px;
  background:rgba(0,0,0,.45);
  border:1px solid rgba(255,255,255,.25);
  font-size:14px;
  font-weight:700;
  opacity:0;
  pointer-events:none;
  transition:opacity .15s ease;
  text-align:center;
}
#hud.show{opacity:1}
video{
  position:fixed;
  width:1px;
  height:1px;
  opacity:.001;
  left:-20px;
  bottom:-20px;
  pointer-events:none;
}
</style>
</head>

<body>
  <div id="redLayer"></div>
  <div id="gestureSurface"></div>

  <button id="lockBtn" aria-label="Bedienung sperren">🔓</button>

  <div id="hud"></div>

  <div id="info">
    ← / → Taschenlampe: langsamer / schneller &nbsp;•&nbsp;
    ↓ / ↑ Rotlicht: langsamer / schneller<br>
    Ganz langsam = Dauerlicht
    <div id="status">Erste Berührung startet die Taschenlampe und fragt nach Kamerazugriff.</div>
  </div>

  <video id="camera" autoplay playsinline muted></video>

<script>
(() => {
  const surface = document.getElementById("gestureSurface");
  const lockBtn = document.getElementById("lockBtn");
  const redLayer = document.getElementById("redLayer");
  const camera = document.getElementById("camera");
  const status = document.getElementById("status");
  const hud = document.getElementById("hud");

  let locked = false;

  let stream = null;
  let track = null;
  let torchReady = false;

  // 0 = Dauerlicht, sonst Frequenz in Hz
  let torchHz = 0;
  let redHz = 0;

  let torchTimer = null;
  let redTimer = null;
  let torchState = true;
  let redState = true;

  let wakeLock = null;

  let startX = 0;
  let startY = 0;
  let lastX = 0;
  let lastY = 0;
  let dragging = false;

  const MIN_HZ = 0.5;
  const MAX_HZ = 12;
  const PX_PER_STEP = 28;

  async function keepAwake(){
    try{
      if("wakeLock" in navigator && !wakeLock){
        wakeLock = await navigator.wakeLock.request("screen");
      }
    }catch(_){}
  }

  async function initTorch(){
    if(track && track.readyState === "live"){
      torchReady = true;
      return true;
    }

    if(!navigator.mediaDevices?.getUserMedia){
      status.textContent = "Kamerazugriff wird von diesem Browser nicht unterstützt.";
      return false;
    }

    try{
      status.textContent = "Kamerazugriff wird angefragt …";

      stream = await navigator.mediaDevices.getUserMedia({
        video:{
          facingMode:{ideal:"environment"},
          width:{ideal:640},
          height:{ideal:480}
        },
        audio:false
      });

      camera.srcObject = stream;
      track = stream.getVideoTracks()[0];
      await camera.play().catch(()=>{});

      await keepAwake();

      torchReady = true;
      status.textContent = "Taschenlampe aktiv.";
      await setTorch(true);
      startTorchPattern();

      return true;
    }catch(err){
      console.error(err);
      status.textContent = "Kamerazugriff erlauben und die Seite über HTTPS öffnen.";
      return false;
    }
  }

  async function setTorch(on){
    if(!track || track.readyState !== "live") return false;
    try{
      await track.applyConstraints({advanced:[{torch:!!on}]});
      torchState = !!on;
      return true;
    }catch(err){
      console.error(err);
      status.textContent = "Die Taschenlampe konnte nicht geschaltet werden.";
      return false;
    }
  }

  function stopTorchTimer(){
    if(torchTimer){
      clearInterval(torchTimer);
      torchTimer = null;
    }
  }

  function startTorchPattern(){
    stopTorchTimer();

    if(!torchReady) return;

    if(torchHz === 0){
      setTorch(true);
      return;
    }

    const half = 1000 / (torchHz * 2);
    torchState = true;
    setTorch(true);

    torchTimer = setInterval(()=>{
      torchState = !torchState;
      setTorch(torchState);
    }, half);
  }

  function stopRedTimer(){
    if(redTimer){
      clearInterval(redTimer);
      redTimer = null;
    }
  }

  function setRed(on){
    redState = !!on;
    redLayer.style.background = on ? "#ff0000" : "#000000";
  }

  function startRedPattern(){
    stopRedTimer();

    if(redHz === 0){
      setRed(true);
      return;
    }

    const half = 1000 / (redHz * 2);
    redState = true;
    setRed(true);

    redTimer = setInterval(()=>{
      setRed(!redState);
    }, half);
  }

  function hzLabel(hz){
    return hz === 0 ? "Dauerlicht" : hz.toFixed(hz % 1 ? 1 : 0) + " Hz";
  }

  function showHud(text){
    hud.textContent = text;
    hud.classList.add("show");
    clearTimeout(showHud.t);
    showHud.t = setTimeout(()=>hud.classList.remove("show"), 700);
  }

  function increaseHz(current, direction){
    // direction +1 = schneller, -1 = langsamer
    if(direction > 0){
      if(current === 0) return MIN_HZ;
      return Math.min(MAX_HZ, Math.round((current + 0.5) * 2) / 2);
    }else{
      if(current === 0) return 0;
      const next = Math.round((current - 0.5) * 2) / 2;
      return next < MIN_HZ ? 0 : next;
    }
  }

  function handleDelta(dx, dy){
    if(locked) return;

    // dominante Achse entscheidet
    if(Math.abs(dx) > Math.abs(dy)){
      const steps = Math.floor(Math.abs(dx) / PX_PER_STEP);
      if(steps < 1) return;

      const dir = dx > 0 ? +1 : -1;
      for(let i=0;i<steps;i++){
        torchHz = increaseHz(torchHz, dir);
      }

      lastX += steps * PX_PER_STEP * (dx > 0 ? 1 : -1);
      showHud("Taschenlampe: " + hzLabel(torchHz));
      startTorchPattern();

    }else{
      const steps = Math.floor(Math.abs(dy) / PX_PER_STEP);
      if(steps < 1) return;

      // nach oben = schneller, nach unten = langsamer
      const dir = dy < 0 ? +1 : -1;
      for(let i=0;i<steps;i++){
        redHz = increaseHz(redHz, dir);
      }

      lastY += steps * PX_PER_STEP * (dy > 0 ? 1 : -1);
      showHud("Rotlicht: " + hzLabel(redHz));
      startRedPattern();
    }
  }

  async function beginGesture(x,y){
    if(!torchReady){
      await initTorch();
    }

    startX = lastX = x;
    startY = lastY = y;
    dragging = true;
  }

  function moveGesture(x,y){
    if(!dragging) return;
    handleDelta(x - lastX, y - lastY);
  }

  function endGesture(){
    dragging = false;
  }

  surface.addEventListener("touchstart", async e=>{
    if(e.touches.length !== 1) return;
    const t = e.touches[0];
    await beginGesture(t.clientX, t.clientY);
  }, {passive:false});

  surface.addEventListener("touchmove", e=>{
    if(e.touches.length !== 1) return;
    e.preventDefault();
    const t = e.touches[0];
    moveGesture(t.clientX, t.clientY);
  }, {passive:false});

  surface.addEventListener("touchend", endGesture, {passive:false});
  surface.addEventListener("touchcancel", endGesture, {passive:false});

  surface.addEventListener("pointerdown", async e=>{
    if(e.pointerType === "touch") return;
    await beginGesture(e.clientX, e.clientY);
  });

  surface.addEventListener("pointermove", e=>{
    if(e.pointerType === "touch") return;
    moveGesture(e.clientX, e.clientY);
  });

  surface.addEventListener("pointerup", endGesture);
  surface.addEventListener("pointercancel", endGesture);

  lockBtn.addEventListener("click", e=>{
    e.stopPropagation();
    locked = !locked;
    lockBtn.textContent = locked ? "🔒" : "🔓";
    lockBtn.setAttribute("aria-label", locked ? "Bedienung entsperren" : "Bedienung sperren");
    showHud(locked ? "Bedienung gesperrt" : "Bedienung entsperrt");
  });

  document.addEventListener("visibilitychange", async ()=>{
    if(document.visibilityState === "visible"){
      await keepAwake();
      startRedPattern();
      if(torchReady) startTorchPattern();
    }
  });

  window.addEventListener("pagehide", ()=>{
    stopTorchTimer();
    stopRedTimer();

    if(track){
      track.applyConstraints({advanced:[{torch:false}]}).catch(()=>{});
    }

    if(stream){
      stream.getTracks().forEach(t=>t.stop());
    }
  });

  // Rotlicht ist sofort dauerhaft an.
  startRedPattern();
  keepAwake();

  if("serviceWorker" in navigator){
    window.addEventListener("load", ()=>{
      navigator.serviceWorker.register("./sw.js").catch(()=>{});
    });
  }
})();
</script>
</body>
</html>
